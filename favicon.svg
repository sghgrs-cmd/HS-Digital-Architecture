<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151a24"/>
      <stop offset="70%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#07090d"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.2)"/>
    </linearGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circular badge base (transparent outside circle) -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#ambient)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <!-- HS. monogram -->
  <text x="215" y="325" font-family="'Syne', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="195" fill="#f1f5f9" text-anchor="middle" letter-spacing="-3">HS</text>
  <circle cx="362" cy="308" r="22" fill="#38bdf8" filter="url(#cyanGlow)"/>
</svg>
